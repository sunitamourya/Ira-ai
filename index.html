<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ira AI Companion</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080b15;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
header {
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: #11172a;
  border-bottom: 1px solid #25365c;
}
.logo {
  color: #75caff;
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 3px;
}
button {
  background: #152a4d;
  color: white;
  border: 1px solid #3976c9;
  border-radius: 10px;
  padding: 11px 15px;
  font-size: 14px;
  cursor: pointer;
}
#menu {
  position: fixed;
  z-index: 5;
  top: 65px;
  bottom: 0;
  left: -260px;
  width: 250px;
  background: #10182b;
  padding: 20px;
  transition: left .25s;
  border-right: 1px solid #31517d;
}
#menu.open { left: 0; }
#menu h3 { color: #80caff; }
.menuitem {
  padding: 14px 8px;
  border-bottom: 1px solid #263650;
  color: #dceaff;
}
main {
  height: calc(100dvh - 65px);
  display: flex;
  flex-direction: column;
}
.status {
  text-align: center;
  color: #8bb8e8;
  font-size: 12px;
  padding: 12px;
}
#stage {
  flex: 1;
  min-height: 250px;
  position: relative;
  overflow: hidden;
  background: radial-gradient(ellipse, #182d50, #080b15 75%);
}
#stage canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  pointer-events: none;
  color: #b7d9ff;
  padding: 25px;
}
.placeholder .symbol {
  font-size: 75px;
  margin-bottom: 15px;
  text-shadow: 0 0 30px #399aff;
}
.placeholder p { color: #91a9ca; font-size: 13px; }
.controls {
  padding: 15px;
  background: #10172a;
  border-top: 1px solid #263b5e;
}
.controls button { margin: 3px; }
.upload {
  display: block;
  text-align: center;
  background: #174b88;
  border: 1px solid #55baff;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
  cursor: pointer;
}
#file { display: none; }
#message {
  color: #9ecaff;
  font-size: 12px;
  text-align: center;
  min-height: 18px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.170.0",
    "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://esm.sh/@pixiv/three-vrm@3.4.2?external=three"
  }
}
</script>
</head>

<body>
<header>
  <button id="menuButton">☰</button>
  <div class="logo">IRA</div>
  <span style="color:#7bcaff;font-size:12px">AI COMPANION</span>
</header>

<nav id="menu">
  <h3>IRA MENU</h3>
  <div class="menuitem">💬 Chat</div>
  <div class="menuitem">🧠 Memory</div>
  <div class="menuitem">🌙 Dreams</div>
  <div class="menuitem">😊 Emotions</div>
  <div class="menuitem">👗 Wardrobe</div>
  <div class="menuitem">🌐 Languages</div>
  <div class="menuitem">✨ Features</div>
  <div class="menuitem">⚙️ Settings</div>
</nav>

<main>
  <div class="status">● IRA SYSTEM ONLINE — AVATAR VIEWER</div>

  <section id="stage">
    <div class="placeholder" id="placeholder">
      <div class="symbol">✧</div>
      <h2>Hello, I'm Ira</h2>
      <p>Your personal AI companion</p>
      <p>Upload your VRM character to give me my 3D body.</p>
    </div>
  </section>

  <section class="controls">
    <label class="upload" for="file">
      ✨ Upload Ira's 3D Body (.vrm)
    </label>
    <input id="file" type="file" accept=".vrm">

    <div style="text-align:center">
      <button id="reset">Reset View</button>
      <button id="fullscreen">Full Screen</button>
    </div>
    <p id="message">Waiting for your 3D character...</p>
  </section>
</main>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";

const stage = document.getElementById("stage");
const placeholder = document.getElementById("placeholder");
const message = document.getElementById("message");

document.getElementById("menuButton").onclick = () => {
  document.getElementById("menu").classList.toggle("open");
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101a32);

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 1.3, 4);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xb8dfff, 0x26304a, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(1, 3, 4);
scene.add(light);

let currentVRM = null;
let initialCamera = new THREE.Vector3(0, 1.3, 4);

function resize() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

new ResizeObserver(resize).observe(stage);
resize();

const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));

document.getElementById("file").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  message.textContent = "Loading Ira's 3D character...";

  try {
    const url = URL.createObjectURL(file);
    const gltf = await loader.loadAsync(url);
    URL.revokeObjectURL(url);

    const vrm = gltf.userData.vrm;
    if (!vrm) throw new Error("This file did not contain a supported VRM model.");

    if (currentVRM) {
      scene.remove(currentVRM.scene);
      VRMUtils.deepDispose(currentVRM.scene);
    }

    currentVRM = vrm;
    VRMUtils.rotateVRM0(vrm);

    scene.add(vrm.scene);

    const box = new THREE.Box3().setFromObject(vrm.scene);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    vrm.scene.position.y -= box.min.y;

    const height = Math.max(size.y, 1);
    camera.position.set(0, height * 0.55, height * 2.5);
    camera.lookAt(0, height * 0.48, 0);

    placeholder.style.display = "none";
    message.textContent = "Ira's 3D body loaded successfully!";

  } catch (error) {
    console.error(error);
    message.textContent = "Could not load model. Check the VRM file and internet connection.";
  }
});

document.getElementById("reset").onclick = () => {
  if (currentVRM) {
    const box = new THREE.Box3().setFromObject(currentVRM.scene);
    const size = box.getSize(new THREE.Vector3());
    const height = Math.max(size.y, 1);
    camera.position.set(0, height * 0.55, height * 2.5);
    camera.lookAt(0, height * 0.48, 0);
  } else {
    camera.position.copy(initialCamera);
    camera.lookAt(0, 1, 0);
  }
};

document.getElementById("fullscreen").onclick = () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen?.();
  }
};

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);

  if (currentVRM) {
    currentVRM.update(delta);
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
  </html>
