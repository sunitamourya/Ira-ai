
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ira AI Companion</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b15;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: #11172a;
  border-bottom: 1px solid #25365c;
}

.logo {
  color: #75caff;
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 3px;
}

button {
  background: #152a4d;
  color: white;
  border: 1px solid #3976c9;
  border-radius: 10px;
  padding: 11px 15px;
  font-size: 14px;
  cursor: pointer;
}

button:active {
  background: #24528b;
}

#menu {
  position: fixed;
  z-index: 5;
  top: 65px;
  bottom: 0;
  left: -260px;
  width: 250px;
  background: #10182b;
  padding: 20px;
  transition: left .25s;
  border-right: 1px solid #31517d;
}

#menu.open {
  left: 0;
}

#menu h3 {
  color: #80caff;
}

.menuitem {
  padding: 14px 8px;
  border-bottom: 1px solid #263650;
  color: #dceaff;
  cursor: pointer;
}

main {
  height: calc(100dvh - 65px);
  display: flex;
  flex-direction: column;
}

.status {
  text-align: center;
  color: #8bb8e8;
  font-size: 12px;
  padding: 12px;
}

#avatar-container {
  flex: 1;
  min-height: 250px;
  position: relative;
  overflow: hidden;
  background: radial-gradient(
    ellipse,
    #182d50,
    #080b15 75%
  );
  touch-action: none;
}

#avatar-container canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  pointer-events: none;
  color: #b7d9ff;
  padding: 25px;
}

.placeholder .symbol {
  font-size: 75px;
  margin-bottom: 15px;
  text-shadow: 0 0 30px #399aff;
}

.placeholder p {
  color: #91a9ca;
  font-size: 13px;
}

.controls {
  padding: 15px;
  background: #10172a;
  border-top: 1px solid #263b5e;
}

.controls button {
  margin: 3px;
}

.upload {
  display: block;
  text-align: center;
  background: #174b88;
  border: 1px solid #55baff;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
  cursor: pointer;
}

#file {
  display: none;
}

#message {
  color: #9ecaff;
  font-size: 12px;
  text-align: center;
  min-height: 18px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.170.0",
    "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://esm.sh/@pixiv/three-vrm@3.4.2?external=three"
  }
}
</script>

</head>

<body>

<header>
  <button id="menuButton">☰</button>

  <div class="logo">IRA</div>

  <span style="color:#7bcaff;font-size:12px">
    AI COMPANION
  </span>
</header>

<nav id="menu">
  <h3>IRA MENU</h3>

  <div class="menuitem">💬 Chat</div>
  <div class="menuitem">🧠 Memory</div>
  <div class="menuitem">🌙 Dreams</div>
  <div class="menuitem">😊 Emotions</div>
  <div class="menuitem">👗 Wardrobe</div>
  <div class="menuitem">🌐 Languages</div>
  <div class="menuitem">✨ Features</div>
  <div class="menuitem">⚙️ Settings</div>
</nav>

<main>

  <div class="status">
    ● IRA SYSTEM ONLINE — AVATAR VIEWER
  </div>

  <section id="avatar-container">

    <div class="placeholder" id="placeholder">
      <div class="symbol">✧</div>

      <h2>Hello, I'm Ira</h2>

      <p>Your personal AI companion</p>

      <p>
        Upload your VRM character to give me my 3D body.
      </p>
    </div>

  </section>

  <section class="controls">

    <label class="upload" for="file">
      ✨ Upload Ira's 3D Body (.vrm)
    </label>

    <input
      id="file"
      type="file"
      accept=".vrm,model/gltf-binary"
    >

    <div style="text-align:center">

      <button id="reset-view">
        Reset View
      </button>

      <button id="fullscreen">
        Full Screen
      </button>

    </div>

    <p id="message">
      Waiting for your 3D character...
    </p>

  </section>

</main>

<script>
document.getElementById("menuButton").addEventListener("click", () => {
  document.getElementById("menu").classList.toggle("open");
});

document.getElementById("fullscreen").addEventListener("click", async () => {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else {
      await document.documentElement.requestFullscreen();
    }
  } catch (error) {
    console.error("Fullscreen unavailable:", error);
  }
});
</script>

<script type="module" src="./src/main.js"></script>

</body>
                                    </html>
